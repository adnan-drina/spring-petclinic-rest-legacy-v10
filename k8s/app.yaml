# Runtime for this project, applied by the shared pipeline's deploy task
# after every green build (the task also pins the image to the platform's
# resolved registry, so the default here is only a bootstrap value).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-rest-legacy-v10
  labels:
    app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
    app.kubernetes.io/part-of: spring-petclinic-rest-legacy-v10
    app.openshift.io/runtime: quarkus
    backstage.io/kubernetes-id: spring-petclinic-rest-legacy-v10
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
        app.kubernetes.io/part-of: spring-petclinic-rest-legacy-v10
        backstage.io/kubernetes-id: spring-petclinic-rest-legacy-v10
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      containers:
        - name: spring-petclinic-rest-legacy-v10
          # Bootstrap tag only — the deploy-app task pins each PipelineRun's
          # immutable revision tag and sets IfNotPresent (V6 P4.1).
          image: quay.io/rhoai3-coding-demo/spring-petclinic-rest-legacy-v10:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PETCLINIC_DB_URL
              value: jdbc:postgresql://spring-petclinic-rest-legacy-v10-postgres:5432/spring-petclinic-rest-legacy-v10
            - name: PETCLINIC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: spring-petclinic-rest-legacy-v10-postgres
                  key: POSTGRESQL_USER
            - name: PETCLINIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-petclinic-rest-legacy-v10-postgres
                  key: POSTGRESQL_PASSWORD
          initContainers:
            - name: wait-for-postgres
              image: registry.redhat.io/rhel9/postgresql-16@sha256:188e892c58c56037c8ff93051f3e3b76ec56773de5ba89791cd4a686f97b0cef
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: spring-petclinic-rest-legacy-v10-postgres
              command:
                - /bin/bash
                - -c
                - until pg_isready -h spring-petclinic-rest-legacy-v10-postgres -p 5432 -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"; do sleep 2; done
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-rest-legacy-v10
  labels:
    app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
    backstage.io/kubernetes-id: spring-petclinic-rest-legacy-v10
spec:
  selector:
    app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spring-petclinic-rest-legacy-v10
  labels:
    app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
    backstage.io/kubernetes-id: spring-petclinic-rest-legacy-v10
spec:
  to:
    kind: Service
    name: spring-petclinic-rest-legacy-v10
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
