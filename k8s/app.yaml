# Runtime for this project, applied by the shared pipeline's deploy task
# after every green build (the task also pins the image to the platform's
# resolved registry, so the default here is only a bootstrap value).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-rest-legacy-v10
  labels:
    app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
    app.kubernetes.io/part-of: spring-petclinic-rest-legacy-v10
    app.openshift.io/runtime: quarkus
    backstage.io/kubernetes-id: spring-petclinic-rest-legacy-v10
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
        app.kubernetes.io/part-of: spring-petclinic-rest-legacy-v10
        backstage.io/kubernetes-id: spring-petclinic-rest-legacy-v10
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      initContainers:
        - name: wait-for-postgres
          image: registry.redhat.io/rhel9/postgresql-16@sha256:188e892c58c56037c8ff93051f3e3b76ec56773de5ba89791cd4a686f97b0cef
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: spring-petclinic-rest-legacy-v10-postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: spring-petclinic-rest-legacy-v10-postgres
                  key: POSTGRESQL_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: spring-petclinic-rest-legacy-v10-postgres
                  key: POSTGRESQL_DATABASE
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-petclinic-rest-legacy-v10-postgres
                  key: POSTGRESQL_PASSWORD
          volumeMounts:
            - name: postgres-schema
              mountPath: /opt/petclinic-schema
              readOnly: true
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              until pg_isready -h "$PGHOST" -p 5432 -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
              present="$(psql -tAc "SELECT COALESCE(to_regclass('public.owners')::text, '')")"
              if [ "$present" = "owners" ]; then
                echo "schema present"
                exit 0
              fi
              psql -v ON_ERROR_STOP=1 -f /opt/petclinic-schema/initDB.sql
              psql -v ON_ERROR_STOP=1 -f /opt/petclinic-schema/baseline-data.sql
      containers:
        - name: spring-petclinic-rest-legacy-v10
          # Bootstrap tag only — the deploy-app task pins each PipelineRun's
          # immutable revision tag and sets IfNotPresent (V6 P4.1).
          image: quay.io/rhoai3-coding-demo/spring-petclinic-rest-legacy-v10:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8080"
            - name: QUARKUS_HTTP_HOST
              value: "0.0.0.0"
            - name: PETCLINIC_DB_URL
              value: jdbc:postgresql://spring-petclinic-rest-legacy-v10-postgres:5432/spring-petclinic-rest-legacy-v10
            - name: PETCLINIC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: spring-petclinic-rest-legacy-v10-postgres
                  key: POSTGRESQL_USER
            - name: PETCLINIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-petclinic-rest-legacy-v10-postgres
                  key: POSTGRESQL_PASSWORD
          volumeMounts:
            - name: postgres-schema
              mountPath: /opt/petclinic-schema
              readOnly: true
          livenessProbe:
            httpGet:
              path: /petclinic/q/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /petclinic/q/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: postgres-schema
          configMap:
            name: spring-petclinic-rest-legacy-v10-postgres-schema
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-rest-legacy-v10
  labels:
    app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
    backstage.io/kubernetes-id: spring-petclinic-rest-legacy-v10
spec:
  selector:
    app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spring-petclinic-rest-legacy-v10
  labels:
    app.kubernetes.io/name: spring-petclinic-rest-legacy-v10
    backstage.io/kubernetes-id: spring-petclinic-rest-legacy-v10
spec:
  to:
    kind: Service
    name: spring-petclinic-rest-legacy-v10
  subdomain: petclinic-v10
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
