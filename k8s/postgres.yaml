    INSERT INTO "roles" ("username", "role") VALUES ('admin', 'ROLE_ADMIN');
    
    -- every generated-identity column the destination schema declares continues
    -- from the seeded maximum, the way the engine the source ran on did
    SELECT setval(pg_get_serial_sequence('vets', 'id'), COALESCE((SELECT max("id") FROM "vets"), 1), (SELECT count(*) > 0 FROM "vets"));
    SELECT setval(pg_get_serial_sequence('specialties', 'id'), COALESCE((SELECT max("id") FROM "specialties"), 1), (SELECT count(*) > 0 FROM "specialties"));
    SELECT setval(pg_get_serial_sequence('types', 'id'), COALESCE((SELECT max("id") FROM "types"), 1), (SELECT count(*) > 0 FROM "types"));
    SELECT setval(pg_get_serial_sequence('owners', 'id'), COALESCE((SELECT max("id") FROM "owners"), 1), (SELECT count(*) > 0 FROM "owners"));
    SELECT setval(pg_get_serial_sequence('pets', 'id'), COALESCE((SELECT max("id") FROM "pets"), 1), (SELECT count(*) > 0 FROM "pets"));
    SELECT setval(pg_get_serial_sequence('visits', 'id'), COALESCE((SELECT max("id") FROM "visits"), 1), (SELECT count(*) > 0 FROM "visits"));
