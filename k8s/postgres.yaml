    -- hand-edited copy rather than overwrite it, and regenerates this file when
    -- the contract below changes. Fix the declared dataset or the schema asset.
    --
    -- The destination's initialized logical data, derived from the baseline the
    -- application contract declares, so the destination starts every parity
    -- comparison from the state the source was captured in (ADR-009).
    --
    -- translator: baseline-data-translator/1.0.0
    -- contract-sha256: da359b9e4610178708f168f76ed77ddd7ab40afe9813039dfe8fbc2303d8a907
    -- destination-engine: postgresql
    -- declared-dataset: src/main/resources/db/hsqldb/populateDB.sql
    -- declared-dataset-sha256: 6d6fd4f158668638aa367f351795aa585d386b32bc8c727ead6417033d04a105
    -- declared-dataset-named-by: corpus derived_from.seed
    -- schema-asset: src/main/resources/db/postgresql/initDB.sql
    -- schema-asset-sha256: e09b38c29e330a2c455490664b1c2f32f88c3c415d26488a998a2cfec9867ccd
    -- rows: owners=10, pets=13, roles=3, specialties=3, types=6, users=1, vet_specialties=5, vets=6, visits=4
    -- sequences: vets.id=6, specialties.id=3, types.id=6, owners.id=10, pets.id=13, visits.id=4, roles.id=(from the loaded rows)
    
