apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-petclinic-rest-legacy-v10-postgres-init
  labels:
    app.kubernetes.io/part-of: spring-petclinic-rest-legacy-v10
data:
  00-load-schema.sh: |
    #!/bin/bash
    set -euo pipefail
    # Load the decided PostgreSQL schema and derived baseline (ADR-009).
    # Runs only on first initialization of this data directory.
    psql -v ON_ERROR_STOP=1 --username "${POSTGRESQL_USER}" --dbname "${POSTGRESQL_DATABASE}" \
      -f /opt/app-root/src/postgresql-schema/initDB.sql
    psql -v ON_ERROR_STOP=1 --username "${POSTGRESQL_USER}" --dbname "${POSTGRESQL_DATABASE}" \
      -f /opt/app-root/src/postgresql-schema/baseline-data.sql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-rest-legacy-v10-postgres
  labels:
    app.kubernetes.io/part-of: spring-petclinic-rest-legacy-v10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-petclinic-rest-legacy-v10-postgres
  template:
    metadata:
      labels:
        app: spring-petclinic-rest-legacy-v10-postgres
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16@sha256:188e892c58c56037c8ff93051f3e3b76ec56773de5ba89791cd4a686f97b0cef
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: spring-petclinic-rest-legacy-v10-postgres
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: init
              mountPath: /opt/app-root/src/postgresql-init
            - name: schema
              mountPath: /opt/app-root/src/postgresql-schema
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: spring-petclinic-rest-legacy-v10-postgres-init
            defaultMode: 0755
        - name: schema
          configMap:
            name: spring-petclinic-rest-legacy-v10-postgres-schema
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-rest-legacy-v10-postgres
  labels:
    app.kubernetes.io/part-of: spring-petclinic-rest-legacy-v10
spec:
  selector:
    app: spring-petclinic-rest-legacy-v10-postgres
  ports:
    - port: 5432
      targetPort: 5432
